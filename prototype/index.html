<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>观澜 · 交互原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e15;color:#e8edf5;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;--bg:#101722;--panel:#192331;--line:#2b394b;--muted:#a3b0c3;--accent:#9bd6c8;--ink:#132e29;--up:#ff858e;--down:#61d4ac}body.light{background:#e9e9e5;color:#202d38;--bg:#f8f8f4;--panel:#fff;--line:#d9dedb;--muted:#596870;--accent:#216957;--ink:#fff;--up:#b52d45;--down:#087454}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:0;min-height:44px;border-radius:12px;padding:10px 14px}button:hover{background:var(--line)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.workspace{display:grid;grid-template-columns:300px minmax(0,440px);gap:64px;max-width:900px;margin:40px auto 100px;padding:0 24px}.aside{padding-top:46px}.brand{letter-spacing:5px;color:var(--accent);font-weight:700}.aside h1{font-size:36px;line-height:1.35;margin:22px 0}.muted,small{color:var(--muted)}.aside p{color:var(--muted)}.steps{display:grid;gap:6px;margin-top:30px}.steps button{text-align:left;border-left:2px solid var(--line);border-radius:0}.steps button.active{border-color:var(--accent);color:var(--accent)}.phone{background:var(--bg);border:1px solid var(--line);border-radius:32px;overflow:hidden;min-height:820px;position:relative;box-shadow:0 25px 80px #0003}.top{padding:24px 22px 12px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:700;letter-spacing:3px}.badge{font-size:11px;padding:3px 8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--muted)}main{padding:8px 20px 110px}h2{font-size:25px;letter-spacing:-.6px;margin:8px 0}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0 16px}small{font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.col{display:flex;flex-direction:column}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin:14px 0}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:600}.primary{background:var(--accent);color:var(--ink);font-weight:650}.primary:hover{filter:brightness(.95);background:var(--accent)}.wide{width:100%;margin-top:12px}.outline{border:1px solid var(--line)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.chip{border:1px solid var(--line);font-size:12px;padding:4px 10px;min-height:36px}.chip.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}.up{color:var(--up)}.down{color:var(--down)}.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,monospace}.indices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.index{background:var(--panel);padding:13px 10px;border-radius:12px}.index strong{display:block;font-size:17px}.stock{display:flex;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}.stock .open{flex:1;text-align:left;padding:0;min-width:0}.stock strong{display:block}.stock input{width:20px;height:20px;accent-color:var(--accent)}.pct{background:color-mix(in srgb,var(--up) 12%,transparent);padding:7px 10px;border-radius:6px;min-width:82px;text-align:center}.stock small{display:block}.bottom{position:absolute;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding:10px 8px 15px;gap:3px}.bottom button{flex:1;font-size:12px;color:var(--muted);padding:6px}.bottom svg{display:block;margin:0 auto 3px;width:21px;height:21px}.bottom .active{color:var(--accent);background:var(--panel)}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}input,select,textarea{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line);color:inherit;border-radius:10px;min-height:44px}textarea{resize:vertical;min-height:90px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:12px;color:var(--muted);padding:10px 0}.separator{border-top:1px solid var(--line);margin:16px 0}.metric{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric div{background:var(--panel);padding:14px;border-radius:12px}.metric strong{display:block;font-size:22px}.notice{border-left:3px solid var(--accent);padding:10px 14px;background:var(--panel);font-size:13px}.report p{font-size:14px}.evidence{font-size:11px;color:var(--accent)}.switcher{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;border:1px solid #526277;background:#263243;color:#fff;border-radius:30px;padding:3px 8px;z-index:50;white-space:nowrap;font-size:12px;box-shadow:0 6px 20px #0005}.switcher button{padding:7px 12px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);max-width:90vw;background:var(--accent);color:var(--ink);padding:12px 20px;border-radius:14px;z-index:70;box-shadow:0 8px 28px #0005}.chart{width:100%;height:auto;display:block;margin:12px 0}.light .indices{display:none}.light .home-intro{padding:18px 0;border-bottom:2px solid var(--accent)}.light .stock{margin:12px 0;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;flex-wrap:wrap}.light .report.card{background:transparent;border:0;border-radius:0;border-top:2px solid var(--accent);padding:20px 0}.light .phone{border-radius:12px}.light .metric{grid-template-columns:1fr}.light .metric div{display:flex;justify-content:space-between;align-items:center}.flowtag{margin:10px 0;color:var(--muted);font-size:12px}.error{color:var(--up)}details{margin-top:25px;font-size:12px;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;font-size:11px}.spark{width:100%;height:28px;margin-top:8px}.empty{text-align:center;padding:40px 12px}.back{padding-left:0;color:var(--accent)}@media(max-width:760px){.workspace{display:block;max-width:480px;padding:0;margin:0 auto 85px}.aside{display:none}.phone{border:0;border-radius:0!important;min-height:calc(100dvh - 75px);box-shadow:none}.top{padding-top:max(18px,env(safe-area-inset-top))}main{padding-bottom:100px}.bottom{position:fixed;bottom:74px;max-width:480px;margin:auto;z-index:30}.switcher{bottom:10px}.light .metric{grid-template-columns:1fr 1fr}.light .metric div{display:block}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.phone.chat-mode{height:850px;min-height:0;display:flex;flex-direction:column}.chat-mode main{flex:1;min-height:0;padding:0 18px;display:flex;flex-direction:column;margin-bottom:82px}.chat-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}.chat-header h2{font-size:20px;max-width:220px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.chat-context{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 0 8px}.chat-context select,.chat-context input{width:auto;max-width:160px;font-size:12px;padding:4px 7px;min-height:34px}.chat-messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px 0 20px;scrollbar-width:thin}.chat-welcome{padding:16px 4px}.chat-welcome h2{font-size:21px}.ai-mark{font-size:40px;color:var(--accent)}.start-tasks{display:grid;gap:10px;margin-top:24px}.start-tasks button{border:1px solid var(--line);background:var(--panel);text-align:left;padding:14px}.start-tasks small,.start-tasks strong{display:block}.message{display:flex;gap:9px;margin:16px 0;align-items:flex-start}.message.user{flex-direction:row-reverse;margin-left:24px}.avatar{flex-shrink:0;background:var(--panel);border-radius:10px;width:28px;height:28px;text-align:center;color:var(--accent)}.bubble{background:var(--panel);padding:12px 14px;border-radius:0 14px 14px 14px;min-width:0}.bubble p{white-space:pre-wrap;overflow-wrap:anywhere;margin:3px 0;font-size:14px}.user .bubble{background:#27483f;border-radius:14px 0 14px 14px}.composer{padding:10px 0 12px;border-top:1px solid var(--line);background:var(--bg)}.composer form{display:flex;align-items:flex-end;gap:8px;margin:7px 0}.composer textarea{min-height:54px;height:64px;max-height:120px;resize:none}.composer button{font-size:23px;min-width:46px}.composer small{font-size:10px}.history-layer{position:absolute;inset:0;z-index:45;background:var(--bg);padding:20px;display:flex;flex-direction:column}.history-items{overflow:auto;min-height:0;padding-bottom:10px}.history-title{text-align:left;width:100%;padding:0}.history-title strong,.history-title small{display:block;overflow-wrap:anywhere}@media(max-width:760px){.phone.chat-mode{height:calc(100dvh - 74px);min-height:0}.chat-mode main{margin-bottom:80px}.chat-header h2{max-width:200px}}
</style></head><body>
<div class="workspace"><aside class="aside"><div class="brand">GUANLAN / 观澜</div><h1>从指标出发，<br>让判断更有依据。</h1><p>个人 A 股投资工作台<br>交互原型 · 所有内容均为虚构演示</p><div class="steps" id="steps"></div><details><summary>当前原型状态</summary><pre id="state"></pre></details><p style="font-size:12px;margin-top:30px">本轮评审：筛选是否顺手？<br>AI 比较能否帮助取舍？<br>观察、预警与复盘是否衔接？</p></aside><section class="phone"><header class="top"><div class="logo">观澜<span style="color:var(--accent)">.</span></div><span class="badge">交互原型 · 演示数据</span></header><main id="app"></main><nav class="bottom" id="nav"></nav></section></div><div class="switcher"><span id="variant"></span><button onclick="reset()">重置临时演示</button></div><div id="toast" class="toast" role="status" hidden></div>
<script>
// Disposable prototype: compare compact market-first and editorial evidence-first layouts.
// No live services, trading, indicator calculation, persistence, or actual AI inference.
const stocks=[{code:'300750',name:'宁德时代',price:'268.50',change:'+3.62%',sector:'电池',reason:'MACD 金叉 · KDJ K=42',priority:'优先观察',support:'示例快照中 MACD 出现金叉，K 值低于 50，符合当前组合条件。',risk:'量价延续尚未验证；本次未接入公告、财报。'},{code:'600519',name:'贵州茅台',price:'1428.60',change:'+1.28%',sector:'白酒',reason:'MACD 金叉 · KDJ K=46',priority:'继续跟踪',support:'同样满足组合条件，可保留在观察池比较后续变化。',risk:'量能证据不足，暂不提高观察优先级。'},{code:'688981',name:'中芯国际',price:'92.56',change:'+2.86%',sector:'半导体',reason:'MACD 金叉 · KDJ K=48',priority:'等待确认',support:'示例中已满足筛选条件，但接近设定的 K 值上界。',risk:'接近阈值不等于更差或更好，需要结合后续走势验证。'},{code:'002594',name:'比亚迪',price:'112.38',change:'−0.86%',sector:'汽车',reason:'未命中组合条件',priority:'未分析'}];
let s={page:'home',stock:0,selected:[0,1,2],observed:[],rules:[],reviews:[],reviewType:'market',reviewDate:'2026-09-10',strategyTab:'fixed',strategyName:'',editingId:null,match:'all',params:{},chatContext:'market',messages:[],chatDraft:'',report:false,screened:false,period:'日K',indicator:'MACD',conditions:['MACD','KDJ'],threshold:50,mode:'normal'};
let theme='A';let timer;
const $=id=>document.getElementById(id);const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2600)}
function go(p){if(p==='review'){newChat(s.reviewType==='stock'?'stock':'market');return}s.page=p;render();window.scrollTo(0,0)}function variant(){theme=theme==='A'?'B':'A';try{history.replaceState(null,'','?variant='+theme)}catch{}render()}function reset(){location.reload()}
function icon(i){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${['<path d="M3 20V4M3 20h18M6 15l4-5 4 3 6-8"/>','<path d="M4 5h16l-6 7v6l-4 2v-8z"/>','<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>','<path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h5"/>','<path d="M4 4h16v13H9l-5 4zM8 8h8M8 12h5"/>'][i]}</svg>`}
function stockRows(list,check=false){return list.map(i=>{let q=stocks[i];return `<div class="stock">${check?`<input type="checkbox" aria-label="选择${q.name}" ${s.selected.includes(i)?'checked':''} onchange="selectStock(${i},this.checked)">`:''}<button class="open" onclick="s.stock=${i};go('detail')"><strong>${q.name}</strong><small>${q.code} · ${q.sector}</small></button><div style="text-align:right"><strong class="num">${q.price}</strong><span class="${q.change.startsWith('−')?'down':'up'} num">${q.change}</span></div>${check?`<small style="width:100%">${q.reason}（预设演示）</small>`:''}</div>`}).join('')}
function selectStock(i,on){s.selected=on?[...new Set([...s.selected,i])]:s.selected.filter(v=>v!==i);render()}
function chart(){let candles=Array.from({length:28},(_,i)=>{let y=98-i*1.8+Math.sin(i*1.7)*17;let up=i%3!==0;return `<line x1="${10+i*11}" y1="${y-12}" x2="${10+i*11}" y2="${y+22}" stroke="var(--${up?'up':'down'})"/><rect x="${7+i*11}" y="${y}" width="6" height="${8+i%5*2}" fill="var(--${up?'up':'down'})"/>`}).join('');return `<svg class="chart" viewBox="0 0 330 170" role="img" aria-label="虚构${s.period}图表示例，不是真实行情"><path d="M0 30H330M0 75H330M0 120H330M0 160H330" stroke="var(--line)" stroke-dasharray="3 4"/>${s.period==='分时'?'<path d="M5 120L18 109L35 116L52 90L70 100L88 83L106 97L123 62L144 68L164 56L180 75L205 45L225 50L246 32L269 40L290 26L321 33" fill="none" stroke="var(--accent)" stroke-width="2"/>':candles}<text x="0" y="168" fill="var(--muted)" font-size="9">示意走势 · 不随指标参数计算</text></svg>`}
function home(){return `<div class="home-intro"><div class="eyebrow">MY MARKET</div><h2>${theme==='B'?'今天，先看什么？':'我的自选'}</h2><small>09月10日 · 收盘样例 / 非真实行情</small></div><div class="indices">${[['上证指数','3286.42','+0.82%'],['深证成指','10824.16','+1.06%'],['创业板指','2268.35','+1.38%']].map(a=>`<div class="index"><small>${a[0]}</small><strong class="up num">${a[1]}</strong><small class="up">${a[2]}</small><svg class="spark" viewBox="0 0 90 25" aria-hidden="true"><path d="M0 22L12 15L20 19L33 8L41 14L52 9L63 12L76 3L90 6" fill="none" stroke="var(--up)" stroke-width="1.5"/></svg></div>`).join('')}</div><div class="card"><div class="eyebrow">从信号，到判断</div><h3>先用指标筛选，再让 AI 比较</h3><p class="muted" style="font-size:13px">保留命中理由，找出值得进一步观察的差异。</p><button class="primary wide" onclick="go('screen')">开始条件选股 →</button></div><div class="row"><h3>关注列表 <small>4</small></h3><button onclick="go('screen')">＋ 找股票</button></div>${stockRows([0,1,2,3])}`}
function toggleCondition(n){s.conditions=s.conditions.includes(n)?s.conditions.filter(x=>x!==n):[...s.conditions,n];render()}
function runScreen(){s.screened=true;s.mode='normal';go('results')}
function results(){return `<button class="back" onclick="go('editor')">← 修改条件</button><div class="eyebrow">02 / CANDIDATES</div><h2>候选股票</h2><p class="muted">先看入选依据，再决定交给 AI 哪几只。</p><div class="notice">当前配置：${esc(s.strategyName||'未命名策略')} / ${s.conditions.join(s.match==='all'?' + ':' 或 ')}${s.conditions.includes('KDJ')?' / K < '+s.threshold:''}<br>下方固定样例基于 MACD 金叉 + KDJ K &lt; 50，未按修改后条件重新计算。</div><div class="chips">${[['normal','正常结果'],['empty','空结果'],['error','加载失败']].map(([k,n])=>`<button class="chip ${s.mode===k?'on':''}" onclick="s.mode='${k}';render()">${n}</button>`).join('')}</div>${s.mode==='empty'?'<div class="empty"><h3>没有符合条件的股票</h3><p class="muted">可调整阈值或扩大筛选范围。</p><button class="outline" onclick="go(\'screen\')">调整条件</button></div>':s.mode==='error'?'<div class="empty"><h3>行情暂时无法获取</h3><p class="muted">未完成筛选，不会展示旧结果为新结果。</p><button class="outline" onclick="s.mode=\'normal\';render()">重试演示</button></div>':`<div class="row"><small>样例候选 3 只 / 样例范围 4 只</small><small>已选 ${s.selected.length} 只</small></div>${stockRows([0,1,2],true)}<button class="primary wide" onclick="analyze()" ${!s.selected.length?'disabled':''}>AI 比较这 ${s.selected.length} 只 →</button><p class="hint">演示报告为预写文案，不会调用模型或产生费用。</p>`}`}
function analyze(){go('loading');setTimeout(()=>{if(s.page==='loading'){s.report=true;s.reportIds=[...s.selected];go('compare')}},900)}
function compare(){let ids=s.reportIds||s.selected;return `<button class="back" onclick="go('results')">← 候选列表</button><div class="eyebrow">03 / AI COMPARISON</div><h2>让选择有据可循</h2><p class="muted">${ids.length} 只候选 · 同一快照 · 预写 AI 样例</p><div class="notice">只比较示例指标信号。新闻、公告和财报未覆盖；排序不代表未来收益。</div>${ids.map(i=>{let q=stocks[i];return `<article class="card report"><div class="row"><h3>${q.name} <small>${q.code}</small></h3><span class="badge">${q.priority}</span></div><span class="evidence">依据 S${i+1} · 演示指标快照</span><p>${q.support}</p><h3>仍需验证</h3><p class="muted">${q.risk}</p><button class="outline" onclick="s.stock=${i};go('detail')">查看依据</button> <button class="primary" onclick="observe(${i})">${s.observed.includes(i)?'已加入观察':'加入观察'}</button></article>`}).join('')}<button class="primary wide" onclick="go('watch')">前往观察池 →</button><button class="outline wide" onclick="openChat('screen')">继续与 AI 讨论选股结果 →</button>`}
function observe(i){if(!s.observed.includes(i))s.observed.push(i);render();notify('已加入观察，保留本次示例筛选与分析依据')}
function detail(){let q=stocks[s.stock];return `<button class="back" onclick="go(s.report?'compare':'home')">← 返回</button><div class="row"><div><h2>${q.name}</h2><small>${q.code} · ${q.sector}</small></div><div class="num up" style="text-align:right;font-size:26px">${q.price}<small style="display:block">${q.change} · 虚构报价</small></div></div><div class="chips">${['分时','日K','周K'].map(p=>`<button class="chip ${s.period===p?'on':''}" onclick="s.period='${p}';render()">${p}</button>`).join('')}<span class="badge">前复权示意</span></div>${chart()}<div class="chips">${['MA','MACD','KDJ','RSI','BOLL'].map(n=>`<button class="chip ${s.indicator===n?'on':''}" onclick="s.indicator='${n}';render()">${n}</button>`).join('')}</div><div class="card"><h3>${s.indicator} · 指标区域示意</h3><p class="num" style="color:var(--accent)">${{MA:'MA5 266.20 / MA20 259.30',MACD:'DIF 2.18 / DEA 1.86 / 柱 0.64',KDJ:'K 42.00 / D 38.10 / J 49.80',RSI:'RSI6 58.20 / RSI12 54.30',BOLL:'上轨 281.20 / 中轨 260.10 / 下轨 239.00'}[s.indicator]}</p><small>固定示例数值，不是该股票的实际指标。</small></div><div class="notice">S${s.stock+1} · ${q.reason}<br>演示数据截止：2026-09-10 收盘<br>公告、财报、新闻：未接入</div><button class="primary wide" onclick="observe(${s.stock})">${s.observed.includes(s.stock)?'已加入观察':'加入观察'}</button><button class="outline wide" onclick="go('alert')">设置预警 →</button><button class="outline wide" onclick="openChat('stock')">与 AI 聊聊这只股票 →</button>`}
function watch(){return `<div class="eyebrow">04 / WATCHLIST</div><h2>我的观察池</h2><p class="muted">记住为什么关注，而不只是股票代码。</p>${s.observed.length?s.observed.map(i=>`<div class="card"><div class="row"><h3>${stocks[i].name}</h3><span class="badge">${stocks[i].code}</span></div><small>来源：${s.report?'本次 AI 比较样例':'个股详情样例'}</small><p>${stocks[i].reason}（演示）</p><button class="outline" onclick="s.stock=${i};go('alert')">设置预警</button> <button onclick="s.stock=${i};s.reviewType='stock';go('review')">个股复盘 →</button></div>`).join(''):'<div class="empty"><h3>还没有观察对象</h3><p class="muted">从候选比较中加入股票，并保留关注依据。</p><button class="primary" onclick="go(\'screen\')">去选股</button></div>'}<div class="row"><h3>预警规则</h3><span class="badge">${s.rules.length} 条 · 仅模拟</span></div>${s.rules.map((r,i)=>`<div class="card"><strong>${stocks[r.stock].name} · ${esc(r.label)}</strong><p class="muted">${r.enabled?'演示中启用':'已暂停'} · ${r.hit?'已模拟命中，未发送通知':'等待模拟触发'}</p><button class="outline" onclick="s.rules[${i}].enabled=!s.rules[${i}].enabled;render()">${r.enabled?'暂停':'启用'}</button> <button ${!r.enabled||r.hit?'disabled':''} onclick="s.rules[${i}].hit=true;render();notify('已产生模拟事件；未发送手机通知')">模拟触发</button></div>`).join('')}<p class="hint">原型不会后台监控或发送通知。观察与预警仅存于本次演示；保存的策略会在本机保留。</p>`}
function alertPage(){return `<button class="back" onclick="go('watch')">← 观察池</button><div class="eyebrow">05 / ALERT</div><h2>设置一个观察条件</h2><p class="muted">${stocks[s.stock].name} · ${stocks[s.stock].code}</p><form onsubmit="saveAlert(event)"><label>触发条件<select id="kind" onchange="$('thresholdField').hidden=this.value==='MACD 金叉'"><option>股价 ≥</option><option>股价 ≤</option><option>涨幅 ≥</option><option>MACD 金叉</option></select></label><label id="thresholdField">阈值<input id="limit" type="number" step="0.01" value="270"></label><div class="card"><h3>提醒方式</h3><p>条件首次满足时提醒，持续满足不重复提醒。</p><small>指标使用已收盘日线；价格使用未复权报价。</small></div><div class="notice">当前为模拟规则。正式版关闭 APP 后的监控需要在线服务及可用推送通道。</div><button class="primary wide">保存演示预警</button></form>`}
function saveAlert(e){e.preventDefault();let kind=$('kind').value,v=Number($('limit').value);if(kind!=='MACD 金叉'&&(!Number.isFinite(v)||v<=0)){notify('请输入大于 0 的演示阈值');return}s.rules.push({stock:s.stock,label:kind==='MACD 金叉'?kind:kind+' '+v+(kind==='涨幅 ≥'?'%':''),enabled:true,hit:false});go('watch');notify('演示规则已保存')}
function render(){document.querySelector('.phone').classList.toggle('chat-mode',s.page==='chat');document.body.classList.toggle('light',theme==='B');$('variant').textContent='深色方案 · 原型 V3';let pages={home,screen,editor,chat,results,compare,detail,watch,alert:alertPage,loading:()=>'<div class="empty"><div class="eyebrow">演示过渡状态</div><h2>正在整理比较维度…</h2><p class="muted">即将展示预写报告，没有发起 AI 调用。</p><button class="outline" onclick="go(\'results\')">取消</button></div>'};$('app').innerHTML=pages[s.page]();let tabs=[['home','看盘'],['screen','选股'],['watch','观察'],['chat','AI 复盘']];$('nav').innerHTML=tabs.map(([p,n],i)=>`<button class="${s.page===p||(p==='screen'&&['results','compare','loading','editor'].includes(s.page))?'active':''}" onclick="go('${p}')">${icon(i)}${n}</button>`).join('');$('steps').innerHTML=[['home','01  看盘与指标'],['screen','02  条件筛选'],['results','03  候选股票'],['compare','04  AI 比较样例'],['watch','05  观察与预警'],['chat','06  AI 复盘与对话']].map(([p,n])=>`<button class="${s.page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');$('state').textContent=JSON.stringify({...s,variant:theme},null,2)}

const strategyKey='guanlan-PROTOTYPE-strategies-v2';
let saved=[];let storageWarning='';
try{const data=JSON.parse(localStorage.getItem(strategyKey)||'[]');if(Array.isArray(data))saved=data.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&Array.isArray(x.conditions)&&x.conditions.every(n=>['MA','MACD','KDJ','RSI','BOLL'].includes(n))&&x.params&&typeof x.params==='object'&&Number.isFinite(x.threshold)&&['all','any'].includes(x.match));}catch{storageWarning='浏览器存储不可用或数据损坏，请勿依赖本次保存。'}
const presets=[{name:'MACD 金叉',conditions:['MACD'],desc:'DIF 从下方向上穿越 DEA',tag:'趋势转强',params:{MACD:'12,26,9'}},{name:'KDJ 低位观察',conditions:['KDJ'],desc:'K 值低于 50，观察后续变化',tag:'位置观察',params:{KDJ:'9,3,3'}},{name:'站上 MA20',conditions:['MA'],desc:'收盘价高于 20 日均线',tag:'均线趋势',params:{MA:'20'}},{name:'RSI 强弱观察',conditions:['RSI'],desc:'RSI6 低于 70',tag:'强弱指标',params:{RSI:'6'}},{name:'BOLL 中轨上方',conditions:['BOLL'],desc:'收盘价位于布林中轨上方',tag:'区间位置',params:{BOLL:'20,2'}}];
function startStrategy(index,custom){const p=presets[index];Object.assign(s,{strategyName:custom?p.name+' · 我的版本':p.name,conditions:[...p.conditions],params:{...p.params},threshold:50,match:'all',editingId:null,custom});go('editor')}
function newStrategy(){Object.assign(s,{strategyName:'',conditions:['MACD','KDJ'],params:{MACD:'12,26,9',KDJ:'9,3,3'},threshold:50,match:'all',editingId:null,custom:true});go('editor')}
function loadStrategy(id){const p=saved.find(x=>x.id===id);Object.assign(s,{strategyName:p.name,conditions:[...p.conditions],params:{...p.params},threshold:p.threshold,match:p.match,editingId:id,custom:true});go('editor')}
function persistStrategies(next){try{localStorage.setItem(strategyKey,JSON.stringify(next));saved=next;return true}catch{notify('保存失败：浏览器存储不可用或空间不足');return false}}
function saveStrategy(){const name=s.strategyName.trim();if(!name){notify('请先给策略起一个名字');return}if(!s.conditions.length){notify('至少选择一个指标条件');return}if(!validParams())return;if(saved.some(x=>x.name===name&&x.id!==s.editingId)){notify('策略名已存在，请换一个名字或编辑已有策略');return}const id=s.editingId||'s'+Date.now();const item={id,name,conditions:[...s.conditions],params:{...s.params},threshold:s.threshold,match:s.match};const next=saved.some(x=>x.id===id)?saved.map(x=>x.id===id?item:x):[...saved,item];if(persistStrategies(next)){s.editingId=id;render();notify('已保存到本机原型策略库，刷新后仍可使用')}}
function deleteStrategy(id){if(persistStrategies(saved.filter(x=>x.id!==id))){render();notify('已删除该原型策略')}}
function validParams(){if(!Number.isFinite(s.threshold)||s.threshold<0||s.threshold>100){notify('K 值阈值应在 0 到 100 之间');return false}for(const n of s.conditions){const v=(s.params[n]||defaults[n]).split(',').map(x=>Number(x.trim()));if(v.length!==defaults[n].split(',').length||v.some(x=>!Number.isFinite(x)||x<=0)){notify(n+' 参数数量不正确或不是正数');return false}}return true}
const defaults={MA:'20',MACD:'12,26,9',KDJ:'9,3,3',RSI:'6',BOLL:'20,2'};
function screen(){return `<div class="eyebrow">01 / STRATEGY LIBRARY</div><h2>用自己的标准选股</h2><p class="muted">从一个指标开始，或组合成你的专属策略。</p><div class="chips"><button class="chip ${s.strategyTab==='fixed'?'on':''}" onclick="s.strategyTab='fixed';render()">固定指标策略</button><button class="chip ${s.strategyTab==='custom'?'on':''}" onclick="s.strategyTab='custom';render()">自定义策略 · ${saved.length}</button></div>${s.strategyTab==='fixed'?presets.map((p,i)=>`<div class="card"><div class="row"><h3>${p.name}</h3><span class="badge">${p.tag}</span></div><p class="muted">${p.desc}</p><small>默认参数 ${Object.values(p.params)[0]} · 已收盘日线</small><div class="row" style="margin-top:12px"><button class="primary" onclick="startStrategy(${i},false)">使用策略</button><button onclick="startStrategy(${i},true)">复制为自定义 →</button></div></div>`).join(''):`<button class="primary wide" onclick="newStrategy()">＋ 新建自定义策略</button>${storageWarning?`<p class="error">${storageWarning}</p>`:''}${saved.length?saved.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p class="muted">${p.conditions.join(p.match==='all'?' + ':' 或 ')} · ${p.match==='all'?'全部满足':'任一满足'}</p><small>保存在本机浏览器 · 原型数据</small><div class="row"><button class="primary" onclick="loadStrategy('${p.id}')">打开策略</button><button onclick="deleteStrategy('${p.id}')">删除</button></div></div>`).join(''):'<div class="empty"><h3>把常用条件保存下来</h3><p class="muted">组合 MACD、KDJ 等内置指标，下次直接使用。</p></div>'}`}<p class="hint">自定义策略 = 组合已有指标条件。本版暂不支持自定义指标公式。</p>`}
function editor(){return `<button class="back" onclick="go('screen')">← 策略库</button><div class="eyebrow">${s.custom?'CUSTOM':'PRESET'} / STRATEGY</div><h2>${s.custom?'编辑自定义策略':esc(s.strategyName)}</h2>${s.custom?`<label>策略名称<input maxlength="40" placeholder="例如：金叉后的低位观察" value="${esc(s.strategyName)}" oninput="s.strategyName=this.value"></label>`:'<p class="muted">固定指标策略使用预设参数，可复制后修改。</p>'}<div class="fields"><label>股票范围<select><option>演示自选池 · 4 只</option></select></label><label>周期与复权<select><option>日线 · 前复权</option></select></label></div><label>条件关系<select ${!s.custom?'disabled':''} onchange="s.match=this.value"><option value="all" ${s.match==='all'?'selected':''}>全部满足 AND</option><option value="any" ${s.match==='any'?'selected':''}>任一满足 OR</option></select></label><div class="card"><h3>指标条件</h3><div class="chips">${Object.keys(defaults).map(n=>`<button class="chip ${s.conditions.includes(n)?'on':''}" ${!s.custom?'disabled':''} onclick="toggleCondition('${n}')">${n}</button>`).join('')}</div>${s.conditions.map(n=>`<div class="separator"></div><h3>${n}</h3><p>${{MA:'收盘价高于均线',MACD:'DIF 上穿 DEA（金叉）',KDJ:'K 值低于设定阈值',RSI:'RSI 低于 70',BOLL:'收盘价高于中轨'}[n]}</p><label>${n} 参数<input aria-label="${n} 参数" value="${esc(s.params[n]||defaults[n])}" ${!s.custom?'readonly':''} oninput="s.params['${n}']=this.value"></label><small>${{MA:'均线周期',MACD:'快线、慢线、信号周期，逗号分隔',KDJ:'RSV 周期、K 平滑、D 平滑',RSI:'RSI 周期',BOLL:'周期、标准差倍数，逗号分隔'}[n]}</small>${n==='KDJ'?`<label>K 值阈值<input type="number" min="0" max="100" value="${s.threshold}" ${!s.custom?'readonly':''} oninput="s.threshold=Number(this.value)"></label>`:''}`).join('')}</div>${s.custom?`<button class="outline wide" onclick="saveStrategy()">${s.editingId?'保存修改':'保存策略'}</button>`:'<button class="outline wide" onclick="s.custom=true;s.strategyName+=\' · 我的版本\';render()">复制并编辑</button>'}<button class="primary wide" onclick="if(validParams())runScreen()" ${!s.conditions.length?'disabled':''}>查看候选样例 →</button><p class="hint">参数可以编辑、保存和复用；原型不执行指标计算，结果仍为固定演示样例。</p>`}

const conversationKey='guanlan-PROTOTYPE-conversations-v3';
let conversations=[];let currentId=null;let historyOpen=false;let deleting=null;let conversationError='';
try{const rows=JSON.parse(localStorage.getItem(conversationKey)||'[]');if(Array.isArray(rows))conversations=rows.filter(c=>c&&typeof c.id==='string'&&typeof c.title==='string'&&['general','market','stock','screen'].includes(c.context)&&Number.isInteger(c.stock)&&stocks[c.stock]&&Array.isArray(c.messages)&&c.messages.every(m=>m&&['user','assistant'].includes(m.role)&&typeof m.text==='string'));}catch{conversationError='历史读取失败，请检查浏览器存储。'}
let currentContext='general';let currentStock=0;let draftDate='2026-09-10';let draft='';
function currentConversation(){return conversations.find(c=>c.id===currentId)}
function saveConversations(next){try{localStorage.setItem(conversationKey,JSON.stringify(next));conversations=next;conversationError='';return true}catch{conversationError='保存失败：浏览器存储不可用，请重试。';notify(conversationError);return false}}
function contextName(context,stock){return context==='stock'?stocks[stock].name+' · 个股复盘':context==='market'?'大盘复盘':context==='screen'?'选股讨论':'自由对话'}
function newChat(context='general'){currentId=null;currentContext=context;currentStock=s.stock;draft='';historyOpen=false;deleting=null;go('chat')}
function openChat(context){newChat(context)}
function openConversation(id){const c=conversations.find(x=>x.id===id);if(!c)return;currentId=id;currentContext=c.context;currentStock=c.stock;draft=c.draft||'';historyOpen=false;deleting=null;go('chat');scrollMessages()}
function updateDraft(value){draft=value;const c=currentConversation();if(c){const next=conversations.map(x=>x.id===c.id?{...x,draft}:x);saveConversations(next)}}
function deleteConversation(id){if(!saveConversations(conversations.filter(c=>c.id!==id)))return;if(currentId===id){currentId=null;currentContext='general';draft=''}deleting=null;render();notify('已删除这条对话')}
function historyPanel(){return `<div class="history-layer" role="dialog" aria-modal="true" aria-label="对话记录"><div class="row"><h2>对话记录</h2><button aria-label="关闭对话记录" onclick="historyOpen=false;deleting=null;render()">✕</button></div><small>本机浏览器保存 · 原型会话</small><button class="primary wide" onclick="newChat()">＋ 新开一轮对话</button>${conversationError?`<p class="error">${esc(conversationError)}</p>`:''}<div class="history-items">${conversations.length?[...conversations].sort((a,b)=>b.updated-a.updated).map(c=>`<div class="card"><button class="history-title" onclick="openConversation('${c.id}')"><strong>${esc(c.title)}</strong><small>${contextName(c.context,c.stock)} · ${new Date(c.updated).toLocaleDateString('zh-CN')} · ${c.messages.length} 条消息</small></button>${deleting===c.id?`<p>删除后将无法恢复。</p><button class="outline" onclick="deleting=null;render()">取消</button><button class="error" onclick="deleteConversation('${c.id}')">确认删除</button>`:`<button class="muted" aria-label="删除对话 ${esc(c.title)}" onclick="deleting='${c.id}';render()">删除</button>`}</div>`).join(''):'<div class="empty"><h3>还没有对话记录</h3><p class="muted">发送第一条消息后，会自动保存。</p></div>'}</div></div>`}
function chat(){const c=currentConversation();const messages=c?.messages||[];return `<div class="chat-header"><div><div class="eyebrow">AI WORKSPACE</div><h2>${c?esc(c.title):'AI 复盘'}</h2></div><div><button aria-label="查看对话记录" onclick="historyOpen=true;render()">记录</button><button aria-label="新建对话" onclick="newChat()">＋</button></div></div><div class="chat-context"><span class="badge">${contextName(currentContext,currentStock)}</span>${currentContext==='stock'&&!c?`<select aria-label="复盘股票" onchange="currentStock=Number(this.value);render()">${stocks.map((q,i)=>`<option value="${i}" ${i===currentStock?'selected':''}>${q.name}</option>`).join('')}</select>`:''}${['stock','market'].includes(currentContext)&&!c?`<input aria-label="复盘日期" type="date" value="${draftDate}" onchange="draftDate=this.value">`:''}${c&&['stock','market'].includes(c.context)?`<small>${esc(c.date)}</small>`:''}</div><div class="chat-messages" id="messageList" role="log" aria-label="聊天消息">${!messages.length?`<div class="chat-welcome"><div class="ai-mark">✧</div><h2>今天想一起复盘什么？</h2><p class="muted">从大盘到个股，把观察和疑问留在同一段对话里。</p><div class="start-tasks"><button onclick="newChat('market');draft='请帮我复盘大盘，整理下一交易日的观察重点。';render()"><strong>大盘复盘 →</strong><small>指数 · 量能 · 板块 · 后续观察</small></button><button onclick="newChat('stock');draft='请复盘这只股票的指标信号和待验证条件。';render()"><strong>个股复盘 →</strong><small>走势 · 指标 · 风险 · 关注理由</small></button></div><p class="hint">也可以直接输入问题，自由交流。</p></div>`:messages.map(m=>`<div class="message ${m.role}"><span class="avatar">${m.role==='user'?'我':'✧'}</span><div class="bubble">${m.role==='assistant'?'<small>AI · 示例回复</small>':''}<p>${esc(m.text)}</p></div></div>`).join('')}${conversationError?`<p class="error">${esc(conversationError)}</p>`:''}</div><div class="composer"><small>演示模式 · 预写回复，未连接真实 AI</small><form onsubmit="sendMessage(event)"><textarea aria-label="聊天消息输入" id="chatInput" required maxlength="2000" placeholder="输入你的问题，或继续追问…" oninput="updateDraft(this.value)" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();this.form.requestSubmit()}">${esc(draft)}</textarea><button class="primary" aria-label="发送消息" type="submit">↑</button></form><small>Enter 发送 · Shift + Enter 换行 · 本机保存</small></div>${historyOpen?historyPanel():''}`}
function scrollMessages(){requestAnimationFrame(()=>{const el=$('messageList');if(el)el.scrollTop=el.scrollHeight})}
function sendMessage(e){e.preventDefault();const question=draft.trim();if(!question)return;if(['stock','market'].includes(currentContext)&&!draftDate&&!currentId){notify('请选择复盘日期');return}let c=currentConversation();const now=Date.now();if(!c)c={id:crypto.randomUUID?crypto.randomUUID():'c'+now,title:question.slice(0,22),context:currentContext,stock:currentStock,date:draftDate,updated:now,messages:[],draft:''};const label=contextName(c.context,c.stock);let text=c.context==='market'?'【大盘复盘样例】\n已知：固定演示快照中上证指数上涨 0.82%。\n信息缺口：真实成交额、上涨家数及板块数据未接入，不能判断市场普涨或热点。\n下一步：补充量能与市场宽度，再观察上涨延续性。':c.context==='stock'?`【${stocks[c.stock].name}复盘样例】\n${stocks[c.stock].reason}（虚构示例）。\n先核对周期与参数，再观察信号是否延续。公告、财报与真实量价序列未接入，不作基本面判断。`:c.context==='screen'?'【选股讨论样例】\n先比较同一批候选的命中理由、量价证据和信息缺口。当前结果为固定样例，未执行真实筛选。':'【自由对话样例】\n我们可以从大盘变化、个股信号或选股依据展开讨论。你可以继续说说关注的对象和疑问。';text+='\n\n本条为预写演示，不是对问题的真实模型分析。'+(['stock','market'].includes(c.context)?'样例行情固定为 2026-09-10，所选日期仅标记会话。':'');const nextC={...c,updated:now,draft:'',messages:[...c.messages,{role:'user',text:question},{role:'assistant',text}]};const next=conversations.some(x=>x.id===c.id)?conversations.map(x=>x.id===c.id?nextC:x):[...conversations,nextC];if(!saveConversations(next))return;currentId=c.id;draft='';render();scrollMessages()}
